# Local replica of online /etc/nginx/sites-enabled/sub2api (sshzyu.com)
# Differences from online: listen 80 only (no TLS/certbot), server_name is a
# placeholder, and proxy_pass targets host.docker.internal:8080 (the local
# sub2api-dev container) instead of 127.0.0.1:8080.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 256m;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # CODEX_DOCS_START
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        alias /opt/sshzyu-docs/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # CODEX_DOCS_END
    location = /image {
        return 301 /image/;
    }

    location ^~ /image/ {
        alias /opt/imageplayground/;
        index index.html;
        try_files $uri $uri/ /image/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # =========================================================================
    # sshzyu_ui frontend integration (mirrors online, 2026-09-09 anti-blank-screen)
    # =========================================================================

    # --- Backend API / gateway / health: identical whitelist to container embed ---
    # NOTE: this regex must stay before the static-file guard below
    # (nginx matches regex locations in order of appearance).
    location ~ ^/(?:api|v1|v1beta|backend-api|antigravity|setup|health|models|responses|alpha/search|images|videos)(?:/|$) {
        include /etc/nginx/snippets/sub2api-proxy.conf;
    }

    # --- Versioned UI asset directory (keeps historical links working) ---
    location ^~ /_sshzyu_ui/releases/ {
        alias /opt/sshzyu-ui/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # --- Cache-bust bootstrap: fixed filename, rewritten on every build ---
    #     Must revalidate on every load. Under the immutable policy below,
    #     browsers would keep the first-seen copy forever and never discover
    #     newly built entry chunks (causes stale routes / "Page not found").
    location = /assets/fw-cachebust.js {
        root /opt/sshzyu-ui/shared;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # --- Vite hashed assets: accumulated across UI releases under shared/assets ---
    #     Missing files must 404, never fall back to the container.
    location ^~ /assets/ {
        root /opt/sshzyu-ui/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # --- Frontend entry + SPA routes: served straight from the current UI version ---
    location / {
        root /opt/sshzyu-ui/current;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # --- Anti-blank-screen guard: missing static files under SPA routes must 404 ---
    location ~* \.(?:js|mjs|css|map|json|webmanifest|txt|xml|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        root /opt/sshzyu-ui/current;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}