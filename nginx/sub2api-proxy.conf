# Local copy of online /etc/nginx/snippets/sub2api-proxy.conf
# Only difference: proxy_pass points at the local sub2api-dev container,
# reached directly over the shared sub2api-network (no host port exposed).
#
# NOTE: proxy_pass 用变量 + Docker 内嵌 DNS(127.0.0.11) 动态解析容器名,
# 容器重建导致 IP 变化时 nginx 自动跟随(10s 缓存),避免缓存旧 IP 造成 502。
# 变量形式与无 URI 的静态 proxy_pass 行为一致: 原样传递请求 URI。
resolver 127.0.0.11 valid=10s ipv6=off;
set $sub2api_upstream http://sub2api-dev:8080;
proxy_pass $sub2api_upstream;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;

add_header X-Accel-Buffering no always;