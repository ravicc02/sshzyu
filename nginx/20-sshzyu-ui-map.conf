# http context; API locations never reference these variables.
map "$request_method:$http_accept" $sshzyu_ui_html_navigation {
    default 0;
    ~*^(GET|HEAD):.*text/html 1;
}
map $sshzyu_ui_html_navigation $sshzyu_ui_if_none_match {
    default $http_if_none_match;
    1 "";
}
map $sshzyu_ui_html_navigation $sshzyu_ui_if_modified_since {
    default $http_if_modified_since;
    1 "";
}
map $sshzyu_ui_html_navigation $sshzyu_ui_accept_encoding {
    default $http_accept_encoding;
    1 "";
}