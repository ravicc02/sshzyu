server {
    listen 80;
    listen [::]:80;
    server_name wb.sshzyu.com;
    access_log off;
    error_log /var/log/nginx/workbuddy-admin.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-workbuddy;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
