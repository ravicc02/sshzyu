server {
    listen 80;
    listen [::]:80;
    server_name wb.sshzyu.com;

    access_log off;
    error_log /var/log/nginx/workbuddy-admin.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-workbuddy;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wb.sshzyu.com;

    ssl_certificate /etc/letsencrypt/live/wb.sshzyu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wb.sshzyu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "WorkBuddy management";
    auth_basic_user_file /etc/nginx/workbuddy-admin.htpasswd;

    access_log off;
    error_log /var/log/nginx/workbuddy-admin.error.log warn;
    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
